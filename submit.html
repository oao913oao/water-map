<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>店家自主上傳｜合格用水場所地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>💧 店家自主上傳</h1>
  <nav><a href="index.html">回地圖</a></nav>
</header>
<main class="page">
  <p class="muted">請上傳淨水設備與濾心照片，送出後由管理員審核，審核通過才會顯示在地圖上。</p>
  <form id="f" class="card">
    <label>店名 *</label><input type="text" name="store_name" required maxlength="100">
    <label>地址 *</label>
    <div class="row"><input type="text" name="address" required maxlength="200" style="flex:1"><button type="button" class="btn ghost" id="locate">在地圖上定位</button></div>
    <p class="muted">也可以直接點地圖調整店家位置。</p>
    <div id="mini" class="mini-map"></div>
    <label>淨水設備品牌／型號</label><input type="text" name="filter_brand" maxlength="100">
    <label>最近一次更換濾心日期</label><input type="date" name="cartridge_changed_at">
    <label>照片 *（設備、濾心、更換紀錄，最多 6 張，每張 5MB 內）</label>
    <input type="file" id="photos" accept="image/*" multiple required>
    <label>聯絡方式（僅管理員可見）</label><input type="text" name="contact" maxlength="100" placeholder="電話或 Email">
    <label>其他說明</label><textarea name="message" rows="3" maxlength="1000"></textarea>
    <div id="out"></div>
    <p><button class="btn" id="send">送出審核</button></p>
  </form>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const f = document.getElementById("f"), out = document.getElementById("out");
const mini = L.map("mini").setView(APP_CONFIG.MAP_CENTER, 7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(mini);
let pos = null, marker = null;
function setPos(p) {
  pos = p;
  marker ? marker.setLatLng(p) : (marker = L.marker(p, { draggable: true }).addTo(mini).on("dragend", e => pos = e.target.getLatLng()));
  mini.setView(p, 17);
}
mini.on("click", e => setPos(e.latlng));
document.getElementById("locate").onclick = async () => {
  const g = await geocode(f.address.value);
  g ? setPos(g) : show("err", "找不到這個地址，請直接點地圖標示位置。");
};
function show(t, m) { out.innerHTML = `<div class="msg ${t}">${esc(m)}</div>`; }

f.addEventListener("submit", async (e) => {
  e.preventDefault();
  const files = [...document.getElementById("photos").files];
  if (files.length > 6) return show("err", "最多 6 張照片。");
  if (files.some(x => x.size > 5 * 1024 * 1024)) return show("err", "每張照片需小於 5MB。");
  const btn = document.getElementById("send"); btn.disabled = true; show("ok", "上傳中…");
  try {
    if (!pos) { const g = await geocode(f.address.value); if (g) pos = g; }
    const folder = "submissions/" + crypto.randomUUID();
    const paths = [];
    for (const file of files) {
      const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
      const path = `${folder}/${paths.length + 1}.${ext}`;
      const { error } = await sb.storage.from(APP_CONFIG.PHOTO_BUCKET).upload(path, file, { contentType: file.type });
      if (error) throw error;
      paths.push(path);
    }
    const d = Object.fromEntries(new FormData(f));
    const { error } = await sb.from("submissions").insert({
      store_name: d.store_name, address: d.address, filter_brand: d.filter_brand || null,
      cartridge_changed_at: d.cartridge_changed_at || null, contact: d.contact || null,
      message: d.message || null, lat: pos?.lat ?? null, lng: pos?.lng ?? null, photo_paths: paths,
    });
    if (error) throw error;
    f.reset(); pos = null; if (marker) { mini.removeLayer(marker); marker = null; }
    show("ok", "已送出！管理員審核後會更新到地圖上，謝謝您。");
  } catch (err) {
    show("err", "送出失敗：" + err.message);
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
