<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>查核後台｜合格用水場所地圖</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    .page { max-width: 980px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
    .tabs button { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 600 .95rem var(--font-body); cursor: pointer; }
    .tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .review { display: grid; gap: 16px; grid-template-columns: 1fr; }
    @media (min-width: 760px) { .review { grid-template-columns: 1.1fr 1fr; } }
    .pick-map { height: 260px; border-radius: var(--radius-s); border: 1px solid var(--line); margin-top: 8px; }
    .code-check.ok { color: var(--pass); font-weight: 700; } .code-check.bad { color: var(--fail); font-weight: 700; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .stats div { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 14px; }
    .stats b { display: block; font-size: 1.8rem; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main class="page">
    <h1>查核後台</h1>
    <div id="msg" role="status" aria-live="polite"></div>
    <div id="app" class="hidden">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="subs" aria-selected="true">待審送件 <span id="n-subs"></span></button>
        <button role="tab" data-tab="claims" aria-selected="false">待審認領 <span id="n-claims"></span></button>
        <button role="tab" data-tab="add" aria-selected="false">新增店家</button>
        <button role="tab" data-tab="stats" aria-selected="false">統計</button>
      </div>
      <section data-panel="subs"><ul class="list" id="subs"></ul></section>
      <section data-panel="claims" class="hidden"><ul class="list" id="claims"></ul></section>
      <section data-panel="add" class="hidden">
        <form class="panel" id="add-form">
          <h2>新增店家</h2>
          <p class="muted">新增後狀態為「未查核」。座標可用地址搜尋，或直接在地圖上點選位置。</p>
          <label for="a-name">店名</label><input id="a-name" required>
          <label for="a-address">地址</label>
          <div class="row"><input id="a-address" required style="flex:1"><button class="btn secondary" type="button" id="a-geo">找座標</button></div>
          <div class="pick-map" id="a-map"></div>
          <p class="muted" id="a-ll">尚未選擇座標</p>
          <label for="a-area">觀光區</label><input id="a-area" placeholder="例如淡水老街">
          <label for="a-cat">類型</label>
          <select id="a-cat"><option>飲料店</option><option>餐廳</option><option>咖啡廳</option><option>冰店</option><option>小吃</option><option>其他</option></select>
          <label for="a-phone">電話 <span class="muted">選填</span></label><input id="a-phone" type="tel">
          <div class="row" style="margin-top:18px"><button class="btn" type="submit">新增店家</button></div>
        </form>
      </section>
      <section data-panel="stats" class="hidden"><div class="stats" id="stats"></div></section>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
