<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>合格用水場所地圖｜觀光區店家淨水設備查核</title>
  <meta name="description" content="旅遊前先查：觀光區店家的淨水設備是否經過查核、濾芯是否按時更換。">
  <meta property="og:title" content="合格用水場所地圖">
  <meta property="og:description" content="旅遊前先查：觀光區店家的淨水設備是否經過查核、濾芯是否按時更換。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/assets/og.png">
  <meta name="theme-color" content="#0B6A88">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body class="map-page">
  <main class="map-wrap">
    <div id="map" role="application" aria-label="店家地圖"></div>

    <div class="searchbox">
      <label for="q" class="hidden">搜尋店名或地址</label>
      <input id="q" type="search" placeholder="搜尋店名或地址" autocomplete="off">
      <label for="area" class="hidden">觀光區</label>
      <select id="area" aria-label="觀光區"><option value="">全部觀光區</option></select>
    </div>
    <ul id="results" class="results hidden" role="listbox" aria-label="搜尋結果"></ul>

    <div class="layerbar" id="layerbar" role="group" aria-label="圖層與圖例"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <script type="module" src="/assets/js/map.js"></script>
</body>
</html>
