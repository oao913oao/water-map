<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>合格用水場所地圖</title>
<meta name="description" content="查詢店家是否使用合格淨水設備：尚未查核、查核合格、查核不合格。">
<meta property="og:title" content="合格用水場所地圖">
<meta property="og:description" content="查詢店家是否使用合格淨水設備，店家也可自主上傳濾心照片。">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>💧 合格用水場所地圖</h1>
  <nav><a href="submit.html">店家自主上傳</a><a href="admin.html">管理</a></nav>
</header>
<div class="layout">
  <aside>
    <div class="filters" id="filters"></div>
    <input type="search" id="q" placeholder="搜尋店名、地址、縣市">
    <p class="muted" id="count">載入中…</p>
    <ul class="list" id="list"></ul>
  </aside>
  <div id="map"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const map = L.map("map").setView(APP_CONFIG.MAP_CENTER, APP_CONFIG.MAP_ZOOM);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap contributors",
}).addTo(map);

const layers = {}, shown = { pending: true, passed: true, failed: true };
for (const k in STATUS) layers[k] = L.layerGroup().addTo(map);
let stores = [], markers = {};

document.getElementById("filters").innerHTML = Object.entries(STATUS).map(([k, s]) =>
  `<label class="chip"><input type="checkbox" data-k="${k}" checked><span class="dot" style="background:${s.color}"></span>${s.label} <b id="n-${k}">0</b></label>`
).join("");
document.getElementById("filters").addEventListener("change", (e) => {
  const k = e.target.dataset.k; shown[k] = e.target.checked;
  shown[k] ? map.addLayer(layers[k]) : map.removeLayer(layers[k]);
  renderList();
});
document.getElementById("q").addEventListener("input", renderList);

function popup(s) {
  const st = STATUS[s.status];
  return `<b>${esc(s.name)}</b><br>
    <span class="tag" style="background:${st.color}">${st.label}</span>
    ${s.inspected_at ? `<span class="muted"> 查核日 ${esc(s.inspected_at)}</span>` : ""}
    <div class="muted">${esc(s.address)}</div>
    ${s.filter_brand ? `<div>淨水設備：${esc(s.filter_brand)}</div>` : ""}
    ${s.cartridge_changed_at ? `<div>最近更換濾心：${esc(s.cartridge_changed_at)}</div>` : ""}
    ${s.inspection_note ? `<div>備註：${esc(s.inspection_note)}</div>` : ""}
    <div class="photos">${(s.photo_paths || []).slice(0, 4).map(p => `<a href="${photoUrl(p)}" target="_blank" rel="noopener"><img src="${photoUrl(p)}" alt="店家照片" loading="lazy"></a>`).join("")}</div>`;
}

function renderList() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const rows = stores.filter(s => shown[s.status] &&
    (!q || [s.name, s.address, s.city].join(" ").toLowerCase().includes(q)));
  document.getElementById("count").textContent = `顯示 ${rows.length} / ${stores.length} 間店家`;
  document.getElementById("list").innerHTML = rows.map(s =>
    `<li data-id="${s.id}"><span class="dot" style="background:${STATUS[s.status].color}"></span> <b>${esc(s.name)}</b><div class="muted">${esc(s.address)}</div></li>`
  ).join("");
}
document.getElementById("list").addEventListener("click", (e) => {
  const li = e.target.closest("li"); if (!li) return;
  const m = markers[li.dataset.id]; map.setView(m.getLatLng(), 17); m.openPopup();
});

(async () => {
  const { data, error } = await sb.from("stores").select("*").order("name");
  if (error) { document.getElementById("count").textContent = "載入失敗：" + error.message; return; }
  stores = data;
  for (const k in STATUS) document.getElementById("n-" + k).textContent = stores.filter(s => s.status === k).length;
  for (const s of stores) {
    markers[s.id] = L.marker([s.lat, s.lng], { icon: pinIcon(s.status), title: s.name })
      .bindPopup(popup(s)).addTo(layers[s.status]);
  }
  renderList();
})();
</script>
</body>
</html>
